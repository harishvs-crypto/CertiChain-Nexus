{% extends "base.html" %}

{% block title %}Error {{ error_code }} - CertiChain Nexus{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="glass-panel" style="padding: 3rem;">
    <h1 style="font-size: 4rem; color: var(--danger); margin-bottom: 0.5rem;">{{ error_code }}</h1>
    <h2>System Notification</h2>
    <p style="color: var(--text-muted); margin: 1rem 0 2rem 0;">{{ message }}</p>
    <a href="{{ url_for('verify.landing') }}" class="btn-primary">Return to Homepage</a>
  </div>
</div>
{% endblock %}
